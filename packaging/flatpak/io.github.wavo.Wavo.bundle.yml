# The release workflow's Flatpak: the binary the Linux job built, packaged
# into the same sandbox as rocks.wavo.WAVO.yml describes. The
# job unpacks the release tarball into built/ beside this file first.
id: rocks.wavo.WAVO
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: wavo
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=all
  - --socket=pulseaudio
  - --share=network
  # Archive encryption key.
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
  # Desktop notifications, which Fastframe sends straight to the server.
  - --talk-name=org.freedesktop.Notifications
  - --persist=.local/state
modules:
  - name: wavo
    buildsystem: simple
    build-commands:
      - install -Dm755 wavo /app/bin/wavo
      - install -Dm644 packaging/applications/*.desktop /app/share/applications/rocks.wavo.WAVO.desktop
      - sed -i 's/^Icon=.*$/Icon=rocks.wavo.WAVO/;s/^StartupWMClass=wavo$/StartupWMClass=rocks.wavo.WAVO/' /app/share/applications/rocks.wavo.WAVO.desktop
      - install -Dm644 packaging/icons/wavo.svg /app/share/icons/hicolor/scalable/apps/rocks.wavo.WAVO.svg
      - install -Dm644 packaging/flatpak/rocks.wavo.WAVO.metainfo.xml /app/share/metainfo/rocks.wavo.WAVO.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/wavo/LICENSE
    sources:
      - type: dir
        path: built
      # Metainfo belongs to this packaging checkout, not the portable archive.
      - type: file
        path: rocks.wavo.WAVO.metainfo.xml
        dest: packaging/flatpak
