# Shared CLI: gem install native-packages --version 0.10.0
---
schema: 1
tool:
  version: 0.10.0
  nfpm: 2.47.0
# Ubuntu 24.04 and Debian 13 use the t64 package names; older releases the
# plain ones. Sound goes to PipeWire itself, else PulseAudio, else ALSA.
libraries:
  libasound.so.2:
    deb: libasound2t64 | libasound2
    rpm: alsa-lib
  libpipewire-0.3.so.0:
    deb: libpipewire-0.3-0t64 | libpipewire-0.3-0
    rpm: pipewire-libs
nfpm:
  name: wavo
  maintainer: Carmine Paolino <carmine@paolino.me>
  homepage: https://wavo.rocks
  description: Fast native WhatsApp client
  license: MIT
  provides: [fastsapp]
  conflicts: [fastsapp]
  replaces: [fastsapp]
  contents:
  - src: "@PAYLOAD@/wavo-v@VERSION@-@TARGET@/wavo"
    dst: "/usr/bin/wavo"
    file_info:
      mode: 493
  - src: "@PAYLOAD@/wavo-v@VERSION@-@TARGET@/LICENSE"
    dst: "/usr/share/licenses/wavo/LICENSE"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/wavo-v@VERSION@-@TARGET@/README.md"
    dst: "/usr/share/doc/wavo/README.md"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/wavo-v@VERSION@-@TARGET@/packaging/applications/wavo.desktop"
    dst: "/usr/share/applications/wavo.desktop"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/wavo-v@VERSION@-@TARGET@/packaging/icons/wavo.svg"
    dst: "/usr/share/icons/hicolor/scalable/apps/wavo.svg"
    file_info:
      mode: 420
  - src: contrib/omarchy/wavo.json.tpl
    dst: /usr/share/wavo/omarchy/wavo.json.tpl
    file_info:
      mode: 420
  - src: contrib/omarchy/wavo-theme
    dst: /usr/share/wavo/omarchy/wavo-theme
    file_info:
      mode: 493
  # native-packages adds the C library (libc6, glibc) at the version the
  # binary needs: 2.39, as the release builds run on Ubuntu 24.04.
  overrides:
    deb:
      depends:
      - libgl1
      - libegl1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - libasound2t64 | libasound2
      - libpipewire-0.3-0t64 | libpipewire-0.3-0
      - libgcc-s1
      - libstdc++6
    rpm:
      depends:
      - libglvnd-glx
      - libglvnd-egl
      - libxkbcommon
      - libxkbcommon-x11
      - libwayland-client
      - libwayland-cursor
      - libwayland-egl
      - libX11
      - libX11-xcb
      - libXcursor
      - libXi
      - libXrandr
      - alsa-lib
      - pipewire-libs
      - libgcc
      - libstdc++
  rpm:
    buildhost: github-actions
targets:
  macos-universal:
    platform: macos
    arch: universal
    formats: [dmg]
    input:
      kind: directory
      local: dist/macos-input
    native:
      command: [ruby, packaging/macos/dmg.rb, '@PAYLOAD@', '@PACKAGE@']
      output: 'wavo-@TAG@-macos-universal.dmg'
  windows-amd64:
    platform: windows
    arch: amd64
    formats: [msi]
    input:
      kind: directory
      local: dist/windows-input-x86_64-pc-windows-msvc
    native:
      command: [ruby, packaging/windows/msi.rb, '@PAYLOAD@', '@PACKAGE@', '@VERSION@']
      output: 'wavo-@TAG@-x86_64-pc-windows-msvc.msi'
  windows-arm64:
    platform: windows
    arch: arm64
    formats: [msi]
    input:
      kind: directory
      local: dist/windows-input-aarch64-pc-windows-msvc
    native:
      command: [ruby, packaging/windows/msi.rb, '@PAYLOAD@', '@PACKAGE@', '@VERSION@']
      output: 'wavo-@TAG@-aarch64-pc-windows-msvc.msi'
  linux-amd64:
    platform: linux
    arch: amd64
    libc: glibc
    compiler_target: x86_64-unknown-linux-gnu
    formats:
    - deb
    - rpm
    - appimage
    input:
      local: dist/wavo-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
      release_asset: wavo-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  linux-arm64:
    platform: linux
    arch: arm64
    libc: glibc
    compiler_target: aarch64-unknown-linux-gnu
    formats:
    - deb
    - rpm
    - appimage
    input:
      local: dist/wavo-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
      release_asset: wavo-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
release:
  repository: abhinavdatta/wavo
  checksums: checksums.txt
  prereleases: true
assets:
  AMD64:
    file: wavo-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
    local: dist/wavo-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  ARM64:
    file: wavo-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
    local: dist/wavo-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
  MACOS:
    file: wavo-v@VERSION@-macos-universal.dmg
    local: dist/wavo-v@VERSION@-macos-universal.dmg
  SOURCE:
    file: wavo-@VERSION@.tar.gz
    url: https://github.com/abhinavdatta/wavo/archive/refs/tags/v@VERSION@.tar.gz
    checksummed: false
    local: dist/wavo-@VERSION@.tar.gz
templates:
  homebrew/wavo.rb: packaging/homebrew/wavo.rb.in
  arch/wavo/PKGBUILD: packaging/arch/wavo/PKGBUILD.in
  arch/wavo/wavo.install: packaging/arch/wavo.install
  arch/wavo-bin/PKGBUILD: packaging/arch/wavo-bin/PKGBUILD.in
  arch/wavo-bin/wavo-bin.install: packaging/arch/wavo.install
  arch/wavo-git/PKGBUILD: packaging/arch/wavo-git/PKGBUILD.in
  arch/wavo-git/wavo-git.install: packaging/arch/wavo.install
repositories:
  homebrew:
    url: https://github.com/abhinavdatta/homebrew-tap.git
    push_url: https://github.com/abhinavdatta/homebrew-tap.git
    branch: main
    package_path: Casks
    files:
      homebrew/wavo.rb: Casks/wavo.rb
    version_file: Casks/wavo.rb
    version_pattern: 'version "([^"]+)"'
    publish: push
  aur-source:
    group: aur
    url: https://aur.archlinux.org/wavo.git
    push_url: ssh://aur@aur.archlinux.org/wavo.git
    branch: master
    package_path: "."
    files:
      arch/wavo: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
  aur-bin:
    group: aur
    url: https://aur.archlinux.org/wavo-bin.git
    push_url: ssh://aur@aur.archlinux.org/wavo-bin.git
    branch: master
    package_path: "."
    files:
      arch/wavo-bin: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
  aur-git:
    group: aur
    url: https://aur.archlinux.org/wavo-git.git
    push_url: ssh://aur@aur.archlinux.org/wavo-git.git
    branch: master
    package_path: "."
    files:
      arch/wavo-git: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
version_file: Cargo.toml
